<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient: Rich Dusty Rose -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C57586"/>
      <stop offset="100%" stop-color="#9C4D5E"/>
    </linearGradient>

    <!-- Gold Gradient for Left Ring -->
    <linearGradient id="goldLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF0B3"/>
      <stop offset="40%" stop-color="#F3BD48"/>
      <stop offset="100%" stop-color="#B87D18"/>
    </linearGradient>

    <!-- Gold Gradient for Right Ring -->
    <linearGradient id="goldRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5CC"/>
      <stop offset="50%" stop-color="#F7C65A"/>
      <stop offset="100%" stop-color="#BF851E"/>
    </linearGradient>

    <!-- Diamond Gradient -->
    <linearGradient id="diamondGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#E1F5FE"/>
      <stop offset="100%" stop-color="#B3E5FC"/>
    </linearGradient>

    <!-- Shadow filter for 3D depth -->
    <filter id="ringShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#4A1822" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Circular Badge Background -->
  <circle cx="32" cy="32" r="30" fill="url(#bgGrad)"/>
  <circle cx="32" cy="32" r="29" fill="none" stroke="#FCE4EC" stroke-width="1.2" stroke-opacity="0.6"/>

  <!-- Subtle inner glow rim -->
  <circle cx="32" cy="32" r="27.5" fill="none" stroke="#FFFFFF" stroke-width="0.6" stroke-opacity="0.3"/>

  <!-- Group for Rings with Shadow -->
  <g filter="url(#ringShadow)">
    <!-- LEFT RING (Base) -->
    <!-- Outer R: 13, Inner R: 9.5 (thickness 3.5), Center: (24.5, 36) -->
    <path fill-rule="evenodd" fill="url(#goldLeft)"
          d="M 24.5 23
             A 13 13 0 1 1 24.49 23
             Z
             M 24.5 26.5
             A 9.5 9.5 0 1 0 24.51 26.5
             Z"/>

    <!-- RIGHT RING (Base) -->
    <!-- Outer R: 13, Inner R: 9.5 (thickness 3.5), Center: (38.5, 33) -->
    <path fill-rule="evenodd" fill="url(#goldRight)"
          d="M 38.5 20
             A 13 13 0 1 1 38.49 20
             Z
             M 38.5 23.5
             A 9.5 9.5 0 1 0 38.51 23.5
             Z"/>

    <!-- INTERLOCKING OVERLAY: Top section of Left Ring drawn over Right Ring -->
    <!-- Clips only the top overlap area to weave them together -->
    <path fill="url(#goldLeft)"
          d="M 28 23.3
             C 32 24.8 35 27.5 35 27.5
             L 32.5 30.2
             C 30 28 27.5 26.5 24.5 26.5
             C 21.5 26.5 19 28 17.5 30
             L 15 27.5
             C 17.5 24.5 21 23 24.5 23
             C 25.8 23 27 23.1 28 23.3 Z"/>

    <!-- DIAMOND SOLITAIRE (On top of Right Ring at 38.5, 14.5) -->
    <!-- Ring Mount / Prongs -->
    <path d="M 35.5 20.5 L 37 17.5 L 40 17.5 L 41.5 20.5 Z" fill="#F7C65A"/>

    <!-- Brilliant Cut Diamond -->
    <!-- Top Crown -->
    <polygon points="38.5,12 34.5,16.5 42.5,16.5" fill="#FFFFFF"/>
    <!-- Facets -->
    <polygon points="38.5,12 36.5,16.5 34.5,16.5" fill="#E1F5FE"/>
    <polygon points="38.5,12 40.5,16.5 42.5,16.5" fill="#B3E5FC"/>
    <!-- Pavilion (Bottom pointed part) -->
    <polygon points="34.5,16.5 42.5,16.5 38.5,20.5" fill="url(#diamondGrad)"/>
    <polygon points="34.5,16.5 38.5,16.5 38.5,20.5" fill="#E1F5FE" opacity="0.7"/>

    <!-- Diamond Sparkle (Star) -->
    <path d="M 44 11.5 Q 44 14.5 47 14.5 Q 44 14.5 44 17.5 Q 44 14.5 41 14.5 Q 44 14.5 44 11.5 Z" fill="#FFFFFF"/>
    <circle cx="44" cy="14.5" r="0.8" fill="#FFF9C4"/>
  </g>
</svg>
